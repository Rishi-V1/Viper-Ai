<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BlueShield{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/blueshield.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom bs-navbar">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="/">🛡 BlueShield</a>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link" href="/">Overview</a>
        <a class="nav-link" href="/incidents">Incidents</a>
        <a class="nav-link" href="/events">Events</a>
        <a class="nav-link" href="/ingest">Ingest</a>
        <a class="nav-link" href="/reports">Reports</a>
        <a class="nav-link" href="/evaluation">Evaluation</a>
        <a class="nav-link" href="/settings">Settings</a>
      </div>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary">Light/Dark</button>
    </div>
  </nav>
  <div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 1080; max-width: 360px;"></div>
  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-muted small py-3 border-top">
    Lab / authorized-use only. Correlations are hypotheses for investigation, not proof of compromise.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
